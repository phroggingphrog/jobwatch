<!--
  experience.html — ATS section partial for Work Experience.

  Field placeholders filled per entry:
    COMPANY          — employer name
    PERIOD           — date range
    ROLE             — job title
    BULLETS          — rendered <li> tags
    LOCATION_BLOCK   — conditional: .job-location div when location present; omitted when absent

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="job">
  <div class="job-role">{{ROLE}}</div>
  <div class="job-company">{{COMPANY}}</div>
  {{LOCATION_BLOCK}}
  <div class="job-period">{{PERIOD}}</div>
  {{OVERVIEW_BLOCK}}
  <div class="job-label">Key Responsibilities</div>
  <ul>
    {{BULLETS}}
  </ul>
  {{ACHIEVEMENTS_BLOCK}}
</div>
<!-- jobwatch: Role Overview / Key Achievements, as in the owner's consultancy CV -->
<!--OVERVIEW_BLOCK--><div class="job-label">Role Overview</div><div class="job-overview">{{OVERVIEW}}</div><!--/OVERVIEW_BLOCK-->
<!--ACHIEVEMENTS_BLOCK--><div class="job-label">Key Achievements</div><ul>{{ACHIEVEMENTS}}</ul><!--/ACHIEVEMENTS_BLOCK-->
<!--LOCATION_BLOCK--><div class="job-location">{{LOCATION}}</div><!--/LOCATION_BLOCK-->
<!--/ENTRY-->
