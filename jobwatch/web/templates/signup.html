<!doctype html>
<html lang="en-AU" data-theme="phrog-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - Jobwatch</title>
<link rel="stylesheet" href="/static/v3/v3.css"><link rel="stylesheet" href="/static/v3/server.css"><script src="/static/app/shell.js" defer></script></head>
<body><main class="auth">
  <h1>Create your account</h1>
  {% if not open %}<p class="muted">Sign-up is closed right now. Ask for an invite.</p>
  {% else %}
  <p class="muted">You need an invite code.</p>
  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <label>Invite code <input name="invite" autocomplete="off" required autofocus></label>
    <label>Name <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required></label>
    <label>Password (8 or more characters) <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="ph-btn ph-btn--default" type="submit">Create account</button>
  </form>
  {% endif %}
  <p class="muted"><a href="/login">Back to sign in</a></p>
</main></body></html>
