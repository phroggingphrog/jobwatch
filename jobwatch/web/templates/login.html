<!doctype html>
<html lang="en-AU" data-theme="phrog-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Jobwatch</title>
<link rel="stylesheet" href="/static/v3/v3.css"><link rel="stylesheet" href="/static/v3/server.css"><script src="/static/app/shell.js" defer></script></head>
<body><main class="auth">
  <h1>Jobwatch</h1>
  <p class="muted">Sign in to see your jobs.</p>
  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Name <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="ph-btn ph-btn--default" type="submit">Sign in</button>
  </form>
  {% if signup_open %}<p class="muted">New here? <a href="/signup">Create an account</a></p>{% endif %}
</main></body></html>
