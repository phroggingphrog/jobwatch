<!doctype html>
<html lang="en-AU" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Jobwatch</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/static/v3/web.css"><script src="/static/v3/shell.js"></script></head>
<body class="wk-root"><main class="wk-auth" id="main">
  <h1 class="wk-h1">Jobwatch</h1>
  <p class="wk-sub">Sign in to see your jobs.</p>
  {% if error %}<div class="wk-note bad" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="wk-form wk-panel wk-pad">
    <div class="wk-field"><label for="u">Name</label><input id="u" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="wk-field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  {% if signup_open %}<p class="wk-sub">New here? <a class="wk-link" href="/signup">Create an account</a></p>{% endif %}
</main></body></html>
