name: Jobwatch backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Native API and bounded runtime (synthetic data only)
        env:
          JOBWATCH_SETTINGS: /dev/null
        run: uv run --no-sync python -m pytest -q tests/test_deepagents_runtime.py
