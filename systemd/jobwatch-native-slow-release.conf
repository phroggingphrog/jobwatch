[Service]
WorkingDirectory=%h/apps/jobwatch-release
ExecStart=
ExecStart=%h/apps/jobwatch-release/.venv/bin/jobwatch --user all run --tier slow --collect-only
Environment=JOBWATCH_SERVICE_UNIT=jobwatch-native-slow.service
ExecStopPost=%h/apps/jobwatch-release/.venv/bin/jobwatch --user all service-exit --unit jobwatch-native-slow.service
