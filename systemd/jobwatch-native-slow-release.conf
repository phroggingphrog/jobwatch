[Service]
WorkingDirectory=%h/apps/jobwatch-release
ExecStart=
ExecStart=%h/apps/jobwatch-release/.venv/bin/jobwatch run --tier slow --collect-only
Environment=JOBWATCH_SERVICE_UNIT=jobwatch-native-slow.service
ExecStopPost=
ExecStopPost=%h/apps/jobwatch-release/.venv/bin/jobwatch service-exit --unit jobwatch-native-slow.service
