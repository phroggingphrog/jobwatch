[Service]
WorkingDirectory=%h/apps/jobwatch-release
ExecStart=
ExecStart=%h/apps/jobwatch-release/.venv/bin/jobwatch --user all run --tier fast --collect-only
Environment=JOBWATCH_SERVICE_UNIT=jobwatch-native-fast.service
ExecStopPost=
ExecStopPost=%h/apps/jobwatch-release/.venv/bin/jobwatch --user all service-exit --unit jobwatch-native-fast.service
