<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobwatch controls</title><link rel="stylesheet" href="/agent/controls.css">
<main><h1>Jobwatch controls</h1><p>Chat in LibreChat. Review decisions, upload your documents and retrieve saved work here.</p>
<p>Keys stay in this page's memory until you close or reload it. Keep the decision key out of LibreChat.</p>
<label>Chat key <input id="run-key" type="password" autocomplete="off"></label>
<label>Decision key <input id="approval-key" type="password" autocomplete="off"></label>
<button id="connect" type="button">Connect / refresh</button>
<p id="status" role="status"></p>
<section><h2>Profile documents</h2>
<label>Document <input id="file" type="file" accept=".pdf,.docx,.txt,.md"></label>
<label>Kind <select id="kind"><option value="cv">CV</option><option value="letter">Letter</option><option value="evidence">Other evidence</option></select></label>
<button id="upload" type="button">Upload privately to Jobwatch</button><p id="uploaded"></p></section>
<section><h2>Recent work and pending decisions</h2><div id="runs"></div></section>
</main><script src="/agent/controls.js" defer></script></html>
