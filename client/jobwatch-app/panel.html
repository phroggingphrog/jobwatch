<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobwatch</title><style>
:root{font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,#172724);background:var(--color-background-primary,#fff);font-size:14px;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--color-border-primary,#ccd8d3);padding-bottom:14px}h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 10px}p{line-height:1.55;margin:8px 0}.muted,small{color:var(--color-text-secondary,#576b63)}#status{margin:12px 0;min-height:20px}.badge{font-size:12px;border:1px solid var(--color-border-primary,#ccd8d3);border-radius:20px;padding:4px 10px}dt{font-weight:600;margin-top:8px}dd{margin:0}img{border-radius:8px;border:1px solid var(--color-border-primary,#ccd8d3)}section,.card{border:1px solid var(--color-border-primary,#ccd8d3);border-radius:12px;padding:16px;margin:12px 0;background:var(--color-background-primary,#fff)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select,textarea{font:inherit;border:1px solid var(--color-border-primary,#b8cbc1);border-radius:7px;padding:9px 11px;color:inherit;background:var(--color-background-primary,#fff);max-width:100%}button{cursor:pointer;min-height:38px}button.primary{background:var(--color-background-info,#145c46);color:var(--color-text-inverse,#fff);border-color:transparent}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #4f9f81;outline-offset:2px}textarea{width:100%;min-height:80px;resize:vertical;display:block;margin:8px 0}label{display:block;line-height:1.5;margin:8px 0}pre{font:13px/1.55 var(--font-mono,ui-monospace,monospace);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;max-height:380px;overflow:auto}details{margin:12px 0}summary{cursor:pointer;line-height:1.6}.model-row{display:grid;grid-template-columns:minmax(100px,1fr) minmax(120px,1.3fr);gap:10px;align-items:center}.answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.notice{border-left:3px solid #c68523;padding-left:12px}#body{max-height:760px;overflow:auto;scrollbar-gutter:stable;padding-right:3px}@media(prefers-color-scheme:dark){:root{--color-text-primary:#e6efea;--color-text-secondary:#a8bcb1;--color-background-primary:#18241f;--color-border-primary:#41584b}}@media(max-width:450px){body{padding:12px}.model-row{grid-template-columns:1fr;gap:0}header{align-items:flex-start}}
</style></head><body><header><div><h1>Jobwatch</h1><small>Jobwatch · in this conversation</small></div><div class="row"><button id="models">Models</button><select id="task" aria-label="Show another task"><option value="auto">Current task</option><option value="profile">Profile</option><option value="jobs">Jobs</option><option value="documents">Documents</option><option value="application">Applications</option></select><span id="phase" class="badge">Connecting</span><button id="refresh" aria-label="Refresh Jobwatch">Refresh</button></div></header><p id="status" role="status" aria-live="polite">Connecting to your Jobwatch run…</p><main id="body"></main><script type="module">/* APP_BUNDLE */</script></body></html>
