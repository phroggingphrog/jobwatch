# jobwatch employer registry: Melbourne/VIC employers likely to hire entry-level staff in the target arms.
# Built 2026-10-06 (Paperclip BUI-73, wave 1 agent B). Method, counts and gaps: employers.NOTES.md.
#
# Every enabled entry was checked live with one polite GET/POST (>=1.6 s apart, normal browser UA,
# no proxy) and returned job data on the verified_at date. Disabled entries say why in `notes`.
#
# Fields
#   name, sector, arms        sector and arms use the BUI-73 brief vocabulary (see NOTES for the
#                             mapping to the rules.yaml arm ids)
#   state                     HQ state; "VIC" marks a VIC employer for rules.yaml unknown-location matching
#   au_scope                  melbourne | victoria | national | global (where the employer hires)
#   provider + params         greenhouse/lever/ashby/workable/smartrecruiters: tenant
#                             workday: host, tenant, site (POST {api_url} {"limit":20,"offset":0,"searchText":"","appliedFacets":{}})
#                             pageup: tenant (client number), feed_url (RSS)
#                             successfactors: feed_url (Career Site Builder googlefeed.xml, RSS 2.0)
#                             oracle-hcm: host, site, api_url (public recruitingCEJobRequisitions REST)
#                             scouttalent: tenant; jsonld: careers_url (+ follow_links)
#                             other: platform + careers_url/api_url (no jobwatch collector yet)
#   poll_tier: slow           large feeds; poll on the 2 h tier, not every 20 min
#   verified_counts           {total, au, vic} postings seen at verification. AU/VIC come from structured
#                             location fields where present (Workday facets, PageUp job:location, SF title
#                             suffix); notes say when counts are from a first page only or set by rule.
#   verified_at               ISO time, Australia/Melbourne
