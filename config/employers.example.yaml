# Example employer registry (synthetic entries only). Copy to employers.yaml and add your own.
# The real registry is owner-private employer reconnaissance and is gitignored.
#
# Schema (one mapping per employer under `employers:`):
#   name         str   required. Display name; also used for "same-state employer" matching.
#   sector       str   free text (bank, university, council, retail, health, ...)
#   arms         list  target arm ids from rules.yaml this employer is likely to hire for
#   state        str   AU state of the employer's main site
#   provider     str   one of: greenhouse | lever | ashby | workable | smartrecruiters |
#                      workday | pageup | employmenthero | scouttalent | jsonld
#   tenant       str   board slug (provider-specific)
#   enabled      bool  default true
#   notes        str   free text
#   verified_at  date  when the endpoint was last confirmed to return jobs
employers:
  - name: Example Technology Co
    sector: technology
    arms: [software_engineer]
    state: VIC
    provider: greenhouse
    tenant: exampletech
    enabled: false
    notes: Synthetic example entry; replace the tenant with a real board slug.
    verified_at: 2026-01-01
  - name: Example Health Service
    sector: health
    arms: [registered_nurse]
    state: VIC
    provider: pageup
    tenant: "000"
    feed_url: https://careers.example.invalid/000/cw/en/rss
    enabled: false
    notes: Synthetic example entry; PageUp RSS.
    verified_at: 2026-01-01
