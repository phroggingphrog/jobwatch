# jobwatch runtime settings. Overridable with env: JOBWATCH_DB, JOBWATCH_CONFIG_DIR, JOBWATCH_EMPLOYERS.
db_path: ~/.local/share/jobwatch/jobwatch.db
timezone: Australia/Melbourne
http:
  timeout: 20        # seconds per request (hard max 20)
  min_delay: 1.5     # seconds between requests to the same host (clamped to 1-2)
alerts:
  max_age_hours: 72        # provider-dated postings older than this get alerts.status 'stale' (bookkeeping; the board decides NEW itself)
retention_days: 90         # non-matching postings unseen this long are deleted
tiers:
  # careers_vic is in both: fast runs read pages 1-2, slow runs read up to 10 pages (newest first,
  # stopping at already-seen ids).
  fast: [ats_greenhouse, ats_lever, ats_ashby, ats_workable, ats_smartrecruiters, ats_workday,
         ats_pageup, ats_employmenthero, ats_scouttalent, ats_oracle, careers_vic,
         ats_pulse, ats_recruitmenthub, ats_jobs_search, ats_elmo, ats_techone, rss, reddit, source_plugins]
  slow: [jobspy_src, seek, jora, careers_vic, ats_successfactors, ats_phenom, ats_atlassian, jsonld_pages]
reader:
  # 7 Oct 2026: every timer run now does AI recall on new Melbourne-area ads (title + first 400 characters, judged by
  # meaning) and then the full-ad AI reader (prompt v5) on up to 60 new matches. Undo: set enabled: false.
  enabled: true
openrouter_extras:
  # Owner 2026-10-12: the OpenRouter key is limited to Jev + embeddings (key file is only needed for Jev). Public ad text only, never CV/visa/answers.
  # Jev holds ads that hide instructions for the AI; embeddings read the closest-to-target ads first.
  # Undo: enabled: false (everything runs as before).
  enabled: true
  key_file: ~/.config/jobwatch/openrouter-jev.key
  jev_model: typesafe/jev-1.13
  jev_hold_at: 0.9        # hidden instructions for the AI -> held
  duplicate_at: 0.8       # same company, >=95% alike, Jev "same vacancy" >= this -> newer copy archived
  knockout_at:            # archive before Opus reads the ad (calibrated 2026-10-12 on 30 real ads)
    citizen_or_pr: 0.9    # ad requires citizenship / PR / clearance / unrestricted rights
    five_years: 0.95      # ad requires 5+ years or is senior/manager level (0.9 caught retail Assistant Managers)
  embed_model: openrouter/qwen/qwen3-embedding-8b  # through OmniRoute (owner 2026-10-12); Jev stays direct
pipeline:
  # One effective AI mode. Collection is independent. Rollback: set reader or pipeline; off disables AI work.
  execution_mode: screened  # main path since 2026-10-31; agentic runs only on promoted shortlisted jobs
  # Legacy flags below are read only when execution_mode is absent.
  enabled: true
  threshold: 3.8          # historical config compatibility; eligibility uses confirmed policy, scores are advisory
  ingest_limit: 20        # node 1: new jobs admitted per run (200 spent the whole budget on fetching, 2026-10-31)
  fetch_budget: 25        # node 1: ad pages fetched per run
  drafts_per_run: 3       # node 5: cost cap; the rest wait for the next run
  drafts_per_day: 10      # node 5: cost cap over 24 h across all runs (about $17/day at $1.70 a draft)
  concurrency: 6
  screened:               # the main path
    promote_per_run: 3    # shortlisted jobs sent to the agentic evaluator per run
    promote_per_day: 10   # same, over 24 h
    min_score: 3.0        # technical default, not an owner number
  agentic:
    # Live since a58b444 (owner-enabled).
    # Legacy flag; use pipeline.execution_mode for dispatch and rollback.
    enabled: true
    credential_index: 1  # key 0 is not allowed for claude/ combos (BUI-350)
    embedding_model: openrouter/qwen/qwen3-embedding-8b  # Owner 2026-10-21: Qwen for candidate evidence, via counted OmniRoute adapter
    job_token_ceiling: 1500000  # 2026-10-12 late: retries of one job share this budget; Morrows hit 900k after 10 writer + 2 reviewer turns. Earlier 2026-10-12: writer now also reads the owner's voice guide; 600k ran out in review round 2;  # BUI-350: 250k ran out mid-evaluation; conservative reservations for complete evidence-backed documents
    batch_token_ceiling: 2000000
    # Optional timing knobs (global; per-person per-job limits are in the person's discovery settings):
    # job_start_seconds: 120            # start another job only while this much of the run window is left; null = start while any is left
    # model_call_seconds: 180           # longest wait for one model reply; null = only the job's own clock
    # model_call_reasoning_seconds: 600 # same, for the high-reasoning writer
    research_enabled: true  # existing local SearXNG; public employer/job facts only
    max_batch_jobs: 20
    concurrency: 2
    decision_policy: profile   # only each person's confirmed preferences; absent facts remain unknown
    # Field and job discovery: defaults below preserve the legacy search/archive behaviour.
    # search_plan: false
    # relevance: shadow       # off | shadow | on; shadow stores judgments but archives nothing
    # dedupe: legacy          # legacy | semantic
    # ordering: legacy        # legacy | hypotheses
  # Discovery tuning defaults. The similarity thresholds are uncalibrated.
  # discovery:
  #   similar_at: 0.60
  #   duplicate_cosine: 0.95
  #   screen_per_run: 40
  #   reconsider_per_run: 20
  #   embedding_token_ceiling: 2000000
  #   screen_token_ceiling: 300000
  #   relevance_model: null   # default to the configured evaluator model


mcp_client:
  # Optional external MCP tools for the career chat agent. OFF by default: when
  # this switch is false (or this section is absent), no MCP package is imported
  # and no server process starts. Server commands are owner-controlled; never add
  # one through chat. This is the client side; it needs the `mcp` install extra
  # (`langchain[mcp]`), the same stack the Jobwatch MCP server uses.
  enabled: false
  servers: []
  # Example stdio server (disabled). Every tool not named in read_only_tools pauses
  # for a human approve/reject decision.
  #  - name: example
  #    enabled: true
  #    transport: stdio
  #    command: python
  #    args: ["-m", "example_mcp"]
  #    people: []              # empty = every Jobwatch person
  #    read_only_tools: []     # raw MCP tool names allowed without approval
  #    startup_timeout_seconds: 15
  #    tool_timeout_seconds: 30
