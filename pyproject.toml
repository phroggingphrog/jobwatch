[project]
name = "jobwatch"
version = "0.1.0"
description = "Agentic career operations with a native API, evidence-bound applications and human approval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-jobspy>=1.1.80",
    "requests>=2.31",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "weasyprint>=60",
    "markdown>=3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "deepagents==0.7.23",
    "langchain>=1.4.0,<2",
    "pypdf>=5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "agentevals>=0.0.9",
]
browser = ["playwright>=1.50,<2"]
mcp = ["langchain[mcp]>=1.4.0,<2"]

[project.scripts]
jobwatch = "jobwatch.cli:main"
jobwatch-mcp = "pipeline.agentic.mcp_server:main"
jobwatch-agent = "pipeline.agentic.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobwatch*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_cv_printer: run the real Chromium CV printer instead of the in-process stand-in"]

[tool.setuptools.package-data]
"jobwatch.web" = ["templates/*.html", "static/*"]
"jobwatch.apply" = ["careerops_templates/*.html", "careerops_templates/sections/*.html", "careerops_templates/NOTICE", "careerops_templates/LICENSE-career-ops"]

"jobwatch.candidate" = ["data/*.json", "data/*.md"]

"jobwatch.preferences" = ["*.R", "*.jags"]

"pipeline.agentic" = ["data/*.json", "data/*.md", "skills/*/SKILL.md"]
