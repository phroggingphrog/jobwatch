# Merge into vanilla LibreChat's existing configuration. No Jobwatch frontend fork.
# Credentials and authenticated subject templates are resolved by the chat server.
version: 1.3.17
interface:
  modelSelect: true
endpoints:
  custom:
    - name: Jobwatch
      apiKey: "${JOBWATCH_LIBRECHAT_IDENTITY_KEY}"
      baseURL: "${JOBWATCH_AGENT_BASE_URL}"
      headers:
        X-Jobwatch-Client-Subject: "{{LIBRECHAT_USER_ID}}"
        X-Jobwatch-Conversation: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      models:
        default: [jobwatch-agent]
        fetch: false
      titleConvo: false
      summarize: false
      modelDisplayLabel: Jobwatch
      tokenConfig:
        jobwatch-agent:
          context: 16000
          prompt: 0
          completion: 0
fileConfig:
  endpoints:
    Jobwatch:
      disabled: false
      supportedMimeTypes: [".*"]
      fileSizeLimit: 10
      totalSizeLimit: 10
      fileLimit: 20
      defaultLLMDeliveryPath:
        fallback: provider
# Jobwatch owns its configured role models. Native Artifacts need no Jobwatch MCP
# server or model preset. Keep unrelated endpoints/MCP/agent/skill settings intact.
